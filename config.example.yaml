# config.yaml としてコピーして使います (書いた項目だけ既定値を上書き)
assets_dir: assets
output_dir: output
# font_path: C:/Windows/Fonts/YuGothB.ttc   # 未指定なら日本語フォントを自動検出

output: {width: 1920, height: 1080, fps: 30, crf: 20, preset: medium}

characters:
  sumire: {names: [すみれ, スミレ], color: "#8E5CF7", side: right}   # side = 立ち絵の位置
  aoi:    {names: [あおい, アオイ, 葵], color: "#1E9BE8", side: left}

transcribe: {model: small, language: ja}   # faster-whisper のモデル (tiny/base/small/medium/large-v3)
speaker: {higher_pitch: aoi}               # 台本なしのとき、声が高い方をこのキャラにする

llm:
  enabled: auto        # auto = ANTHROPIC_API_KEY があれば Claude で解析 / false = 使わない
  model: claude-opus-5

silence_cut: {noise_db: -38, min_silence: 0.7, keep_padding: 0.18}
audio: {target_lufs: -14, highpass_hz: 80, denoise: true, compressor: true}
bgm: {volume_db: -24, ducking: true, fade_in: 2.0, fade_out: 3.0, mood: auto}   # mood: auto/calm/bright/tense
background: {video_scale: 0.72, border: 8, border_color: "#FFFFFF", per_chapter: true}
materials: {min_duration: 3.0, max_duration: 7.0, max_per_minute: 6, box: [0.30, 0.10, 0.40, 0.42]}  # box = x,y,幅,高さ(画面比)
expressions: {height_ratio: 0.50, bob: true}
se: {volume_db: -6, min_gap: 2.5}
cutin: {duration: 1.6, max_count: 8, min_gap: 25}
wipe: {diameter: 240, border: 8, position: top-right, video: null}   # video に顔出し動画を指定すると丸抜きで表示
subtitles: {font_size: 60, max_chars_per_line: 22}
popup: {duration: 7.0, triggers: [お願いがあるの, チャンネル登録]}
shorts: {length: 45}
# pexels_api_key: xxxxx   # 手持ち素材に無いキーワードの画像を Pexels から自動取得
